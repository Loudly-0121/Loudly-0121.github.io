<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOUDLY | Works</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        /* 随机风景画背景 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* 暗色遮罩 */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        .card {
            text-align: center;
            padding: 40px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            max-width: 720px;
            width: 100%;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .name {
            font-size: 44px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #ffffff;
            margin-bottom: 14px;
        }

        .desc {
            color: #eaeaea;
            font-size: 16px;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .work-item {
            display: block;
            padding: 24px 16px;
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .work-item:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-4px);
        }

        .work-item h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .work-item p {
            font-size: 14px;
            color: #ddd;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            border-radius: 12px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        footer {
            margin-top: 30px;
            color: #cfcfcf;
            font-size: 13px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="name">LOUDLY</div>
    <p class="desc">My Works</p>

    <div class="works-grid">
        <a href="#" class="work-item">
            <h3>作品 01</h3>
            <p>项目介绍文字</p>
        </a>

        <a href="#" class="work-item">
            <h3>作品 02</h3>
            <p>项目介绍文字</p>
        </a>

        <a href="#" class="work-item">
            <h3>作品 03</h3>
            <p>项目介绍文字</p>
        </a>

        <a href="#" class="work-item">
            <h3>作品 04</h3>
            <p>项目介绍文字</p>
        </a>
    </div>

    <a href="index.html" class="back-btn">返回主页</a>
</div>


<script>
    // 和主页、联系页完全一致的风景背景列表
    const landscapes = [
        "https://picsum.photos/id/1018/1920/1080",
        "https://picsum.photos/id/1015/1920/1080",
        "https://picsum.photos/id/1019/1920/1080",
        "https://picsum.photos/id/1016/1920/1080",
        "https://picsum.photos/id/1021/1920/1080",
        "https://picsum.photos/id/1039/1920/1080",
        "https://picsum.photos/id/1043/1920/1080",
        "https://picsum.photos/id/1044/1920/1080"
    ];

    // 随机选一张背景
    const randomBg = landscapes[Math.floor(Math.random() * landscapes.length)];
    document.body.style.setProperty("--bg-image", `url(${randomBg})`);
</script>

</body>
</html>
